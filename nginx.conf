map $uri $flowpilot_cache_control {
    default "no-cache";
    ~^/api/ "no-store";
    ~^/healthz "no-store";
    ~^/assets/ "public, max-age=604800, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;
    # Keep every add_header at this level so child locations inherit security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $flowpilot_cache_control always;
    access_log off;

    # Internal engine callbacks only use the private Compose service address.
    location ^~ /api/internal/ {
        return 404;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied forwarding headers; the private API trusts this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 420s;
        proxy_buffering off;
    }
    location = /healthz {
        proxy_pass http://api:8000/healthz;
        access_log off;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
