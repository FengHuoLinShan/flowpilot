name: ${COMPOSE_PROJECT_NAME:-flowpilot}

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://flowpilot:${FLOWPILOT_DB_PASSWORD:?Run scripts/bootstrap.py first}@postgres:5432/flowpilot
  FLOWPILOT_ADMIN_PASSWORD: ${FLOWPILOT_ADMIN_PASSWORD:?Run scripts/bootstrap.py first}
  FLOWPILOT_SESSION_SECRET: ${FLOWPILOT_SESSION_SECRET:?Run scripts/bootstrap.py first}
  FLOWPILOT_WEBHOOK_KEY: ${FLOWPILOT_WEBHOOK_KEY:?Run scripts/bootstrap.py first}
  FLOWPILOT_INTERNAL_KEY: ${FLOWPILOT_INTERNAL_KEY:?Run scripts/bootstrap.py first}
  FLOWPILOT_ENCRYPTION_KEY: ${FLOWPILOT_ENCRYPTION_KEY:?Run scripts/bootstrap.py first}
  COMPANY_NAME: ${COMPANY_NAME:-Starbridge Automation}
  WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-n8n}
  N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
  N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/flowpilot}
  N8N_API_KEY: ${N8N_API_KEY:-}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
  PUBLIC_FORM_ENABLED: ${PUBLIC_FORM_ENABLED:-true}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
  OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
  FLOWPILOT_TEST_MODE: ${FLOWPILOT_TEST_MODE:-false}
  FLOWPILOT_ALLOW_FAULTS: ${FLOWPILOT_ALLOW_FAULTS:-false}
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  DEMO_DATA_PATH: /data/leads.json
  TZ: Asia/Shanghai

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py first}
      FLOWPILOT_DB_PASSWORD: ${FLOWPILOT_DB_PASSWORD:?Run scripts/bootstrap.py first}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Run scripts/bootstrap.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-flowpilot.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [flowpilot]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    # No host port is published. Only the private proxy supplies client IP headers.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --proxy-headers, --forwarded-allow-ips, '*']
    environment: *app-environment
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [flowpilot]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: [python, -m, app.worker]
    environment: *app-environment
    volumes:
      - ./data:/data:ro
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_healthy
    networks: [flowpilot]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.46.6}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Run scripts/bootstrap.py first}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/bootstrap.py first}
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_CUSTOM_EXTENSIONS: /opt/flowpilot/nodes
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_LOG_LEVEL: warn
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: '10000'
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:${N8N_PORT:-5678}:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/custom-nodes:/opt/flowpilot/nodes:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [flowpilot]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [flowpilot]

  ollama:
    image: ollama/ollama:0.40.14
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 20
    networks: [flowpilot]

volumes:
  postgres_data:
  n8n_data:
  ollama_data:

networks:
  flowpilot:
