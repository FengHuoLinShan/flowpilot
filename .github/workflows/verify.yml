name: FlowPilot verification
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: flowpilot_test
          POSTGRES_PASSWORD: ci-disposable-test-password
          POSTGRES_DB: flowpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowpilot_test -d flowpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify SQLite contract and recovery
        if: matrix.database == 'sqlite'
        run: python -m pytest -q --junitxml=artifacts/pytest-sqlite.xml
      - name: Verify native PostgreSQL transactions and recovery
        if: matrix.database == 'postgres'
        env:
          FLOWPILOT_TEST_DATABASE_URL: postgresql+psycopg://flowpilot_test:ci-disposable-test-password@127.0.0.1:5432/flowpilot_test
        run: python -m pytest -q --junitxml=artifacts/pytest-postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.database }}
          path: artifacts/*.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: node --test ../n8n/custom-nodes/FlowPilotWebhook.test.cjs
      - run: python3 -m unittest discover -s ../scripts/tests -p test_import_n8n.py -v
